audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 512
  input_device: null
  output_device: null
vad:
  speech_start_frames: 4
  speech_end_frames: 25
  max_recording_seconds: 15
  startup_ignore_ms: 500
  silero_threshold: 0.5
stt:
  model: small.en
  device: cpu
  compute_type: int8
llm:
  providers:
    groq:
      type: openai_compatible
      api_key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1
      models:
        default: meta-llama/llama-4-scout-17b-16e-instruct

    openrouter:
      type: openai_compatible
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      models:
        default: deepseek/deepseek-v4-flash:free

    gemini:
      type: google
      api_key_env: GEMINI_API_KEY
      models:
        default: gemini-2.5-flash

    cerebras:
      type: openai_compatible
      api_key_env: CEREBRAS_API_KEY
      base_url: https://api.cerebras.ai/v1
      models:
        fast: gpt-oss-120b
        cheap: zai-glm-4.7

  routing:
    main_agent:
      provider: groq
      model: default
      temperature: 0.7
      max_tokens: 1024
      fallback:
        - provider: cerebras
          model: fast
    summarizer:
      provider: gemini
      model: default
      temperature: 0.3
      max_tokens: 256
      fallback: []
    sub_agent:
      provider: cerebras
      model: cheap
      temperature: 0.5
      max_tokens: 1024
      fallback: []
    announcement:
      provider: groq
      model: default
      temperature: 0.7
      max_tokens: 512
      fallback: []
  system_prompt_path: SOUL.md

tts:
  primary: kokoro
  kokoro:
    voice: af_heart
    sample_rate: 24000
pipeline:
  listening_timeout: 10
  processing_timeout: 30
mode: wake_word
memory:
  max_turns: 20
  db_path: ~/.daisy/memory.db
  inject_facts: true
  max_facts_to_inject: 15
wake_word:
  model: models/daisy.tflite
  threshold: 0.4
api:
  host: 0.0.0.0
  port: 8443
tools:
  enabled: true
  allowed_directories:
  - /home/bashman/Code
  - /home/bashman/Downloads
  file_max_size_bytes: 1048576
  allowed_commands:
  - df
  - free
  - uptime
  - uname
  - whoami
  - ls
  - cat
  - ps
  - ping
  - systemctl
  default_timeout: 30
  max_timeout: 300
  opencode:
    enabled: true
    project_root: /home/bashman/Code
    model:
    skip_permissions: true
